<!doctype html>
<html lang="en" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="BHU-DRISHTI: National Land Acquisition Intelligence, Decision Support & Control Tower under the RFCTLARR Act, 2013. Department of Land Resources (DoLR), Ministry of Rural Development." />
    <meta name="theme-color" content="#0F172A" />
    <!-- Internal departmental control tower: not a public site, so keep it out of search indexes. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230D9488'><circle cx='12' cy='12' r='10'/></svg>" />
    
    <!-- Google Fonts: Inter & JetBrains Mono.
         Loaded non-render-blocking: a plain <link rel=stylesheet> here stalls
         first paint on a third-party round trip (Lighthouse "render-blocking
         requests"). Preconnecting removes most of the DNS/TCP/TLS cost, and
         swapping media to "all" applies the fonts once they arrive instead of
         gating the first render on them. font-display=swap is set in the URL,
         so text paints in the fallback face first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    </noscript>
    
    <title>BHU-DRISHTI | National Land Acquisition Control Tower</title>
  </head>
  <body class="h-full font-sans antialiased text-gov-text bg-gov-bg selection:bg-teal-100 selection:text-teal-900">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
